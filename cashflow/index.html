<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>자금 입출금 일정</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b2430;--sub:#6b7280;--line:#e5e7eb;--acc:#2f6f62;--err:#b5472d}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#212121;--ink:#ecebe7;--sub:#a3a19b;--line:#3a3a38;--acc:#5fae9c;--err:#f2b8b5}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:360px}
h1{font-size:19px;margin:0 0 4px}p{margin:0 0 18px;color:var(--sub);font-size:14px}
input[type=password]{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:6px;align-items:center;margin:12px 0 16px;font-size:14px;color:var(--sub)}
button{width:100%;padding:11px;font-size:16px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--err)}
body.open{display:block;padding:0;background:#f6f5f1}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style></head><body>
<form id="f" autocomplete="on">
<h1>자금 입출금 일정</h1><p style="margin-bottom:12px">암호를 입력하세요.</p>
<input type="password" id="pw" autocomplete="current-password" autofocus aria-label="암호">
<p id="left" style="margin:10px 0 14px;font-size:13px"></p>
<button id="go">열기</button><div id="msg" role="alert"></div>
</form>

  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();run(document.getElementById('pw').value);});
  lockUi();
